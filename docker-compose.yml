version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: welding_shop_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-welding_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ShopSecurePassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-welding_shop_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-welding_admin} -d ${POSTGRES_DB:-welding_shop_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
